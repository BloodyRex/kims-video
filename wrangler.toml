# Router Worker — 沿用 name="kims-video" 保住 api.bloodyrex.xyz 自定义域名
# 按路径经 Service Bindings 分发到 5 个子 worker；内置 poster-proxy。
name = "kims-video"
main = "workers/router.js"
compatibility_date = "2024-12-01"

[[services]]
binding = "DISCOVER_WORKER"
service = "kims-video-discover"

[[services]]
binding = "INTEL_WORKER"
service = "kims-video-intel"

[[services]]
binding = "DIGEST_WORKER"
service = "kims-video-digest"

[[services]]
binding = "ADMIN_WORKER"
service = "kims-video-admin"

[[services]]
binding = "WALL_WORKER"
service = "kims-video-wall"
