  function readStart(){
    var qp=new URLSearchParams(location.search);
    var st=qp.has('st')?Math.round(Number(qp.get('st'))||0):GAME_START_STAGE[siteLvl-1];
    var er=qp.has('er')?Number(qp.get('er'))||0:GAME_START_ENERGY[siteLvl-1];
    return {
      stage:Math.max(0,Math.min(GAME_START_STAGE.length-1,st)),
      energy:Math.max(0,Math.min(1,er))
    };
  }
  var startState=readStart();
  try{game=EvolutionGame.mount(frame,{startLevel:startState.stage,startEnergy:startState.energy,onFullscreenRequest:requestFs});}catch(e){console.error('EvolutionGame mount failed:',e);return;}
  window.gameInstance=game;

  // ——— 全屏键（画布 HUD 内）的动作：优先真 Fullscreen API；iOS Safari 不支持则退伪全屏 ———
  var pseudoFs=false;
  function fsEl(){return document.fullscreenElement||document.webkitFullscreenElement||null;}
  function reportFs(on){try{if(window.parent&&window.parent!==window)window.parent.postMessage({type:'pixel-avatar:fullscreen',on:!!on},'*');}catch(e){}}
  // 全屏时把画布按 16:9 换算成最大可容纳尺寸，保证坐标映射不变形
  function fitCanvas(){
    var c=document.getElementById('evolution-canvas');if(!c)return;
    if(!(pseudoFs||fsEl())){['width','height','max-height'].forEach(function(k){try{c.style.removeProperty(k);}catch(e){}});return;}
    var W=window.innerWidth||document.documentElement.clientWidth||360;
    var H=window.innerHeight||document.documentElement.clientHeight||640;
    var s=Math.min(W/640,H/360);
    c.style.setProperty('width',Math.max(160,Math.round(640*s))+'px','important');
    c.style.setProperty('height',Math.max(90,Math.round(360*s))+'px','important');
    c.style.setProperty('max-height','none','important');
  }
  function applyFs(on){
    document.body.classList.toggle('game-fs',!!on);
    if(window.gameInstance&&window.gameInstance.setFullscreenState)window.gameInstance.setFullscreenState(!!on);
    fitCanvas();
    if(on)setTimeout(fitCanvas,90);
  }
  function enterPseudo(){pseudoFs=true;reportFs(true);applyFs(true);}
  function requestFs(on){
    if(on){
      if(fsEl()){applyFs(true);return;}
      var el=document.querySelector('.main')||frame,p=null;
      try{ p=el.requestFullscreen?el.requestFullscreen({navigationUI:'hide'}):(el.webkitRequestFullscreen?el.webkitRequestFullscreen():null); }catch(e){p=null;}
      if(p&&typeof p.then==='function'){
        p.then(function(){
          applyFs(true);
          try{if(screen.orientation&&screen.orientation.lock)screen.orientation.lock('landscape').catch(function(){});}catch(e){}
        }).catch(function(){enterPseudo();});
      }else if(p){
        setTimeout(function(){if(fsEl())applyFs(true);else enterPseudo();},90);
      }else{
        enterPseudo();
      }
    }else{
      var q=null;
      if(fsEl()){try{q=document.exitFullscreen?document.exitFullscreen():(document.webkitExitFullscreen?document.webkitExitFullscreen():(document.webkitCancelFullScreen?document.webkitCancelFullScreen():null));}catch(e){}}
      if(q&&typeof q.then==='function')q.catch(function(){});
      if(pseudoFs){pseudoFs=false;reportFs(false);}
      applyFs(false);
      try{if(screen.orientation&&screen.orientation.unlock)screen.orientation.unlock();}catch(e){}
    }
  }
  if(window.gameInstance&&window.gameInstance.setFullscreenHandler)window.gameInstance.setFullscreenHandler(requestFs);
  // 用户按 Esc / 系统手势退出全屏时，把按钮图标同步回来
  ['fullscreenchange','webkitfullscreenchange'].forEach(function(ev){
    document.addEventListener(ev,function(){
      if(fsEl())applyFs(true);else if(!pseudoFs)applyFs(false);
    });
  });
  window.addEventListener('resize',function(){if(pseudoFs||fsEl())fitCanvas();});
  window.addEventListener('orientationchange',function(){if(pseudoFs||fsEl())setTimeout(fitCanvas,150);});
  window.pixelFullscreen={request:requestFs,isFull:function(){return !!(pseudoFs||fsEl());}};

  // 网站等级变化时同步开局生物阶段与起始能量（外部 ?level= 与内部调试滑块都走这里）。
  function syncGameLevel(){
    siteLvl=Math.max(1,Math.min(10,Number(level)||1));
    startState=readStart();
    if(game.setStartLevel)game.setStartLevel(startState.stage,startState.energy);
    if(DEMO_MODE){game.setDebugEnabled(true);}else{game.setDebugEnabled(false);}
  }
  syncGameLevel();

  // Wire level slider to game debug level
  var lr=document.getElementById('level-range');
  if(lr){
    lr.addEventListener('input',function(){
      level=parseInt(this.value)||1;
      syncGameLevel();
    });
  }

  // Language sync
  function syncLang(){
    if(game&&game.setLanguage)game.setLanguage(lang);
  }
  syncLang();
  // Listen for lang button clicks (existing handlers in page)
  document.querySelectorAll('[id^="lang-"]').forEach(function(btn){
    btn.addEventListener('click',function(){
      lang=this.id==='lang-zh'||this.id==='lang-zh-m'?'zh':'en';
      syncLang();
    });
  });

  console.log('[EvolutionGame] mounted, initial level='+level+' (game rank '+(level)+')');
})();
</script>

.stage{min-height:0!important;aspect-ratio:16/9!important}
.evolution-game-frame{aspect-ratio:16/9}
@media (max-width:900px){
  body{padding:0!important}
  .shell{border:0!important;box-shadow:none!important}
  .main{padding:4px!important;gap:8px!important}
  .stage-frame{border-width:3px!important;box-shadow:none!important}
}
