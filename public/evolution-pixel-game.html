<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#071723" />
  <title>生命进化史 V8 · Life Evolution</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #071723; }
    body { min-height: 100vh; display: grid; place-items: center; padding: 14px; }
    .shell { width: min(100%, 1180px); }
    .game-frame { width: 100%; padding: 7px; background: #102e40; border: 2px solid #396477; box-shadow: 0 14px 38px rgba(0,0,0,.42), inset 0 0 0 2px #071a29; }
    canvas { display: block; width: 100%; height: auto; aspect-ratio: 16 / 9; image-rendering: auto; touch-action: none; outline: none; background: #082538; }
    @media (max-width: 650px) { body { padding: 4px; } .game-frame { padding: 2px; border-width: 1px; } }
  </style>
</head>
<body>
  <main class="shell">
    <section class="game-frame" id="game" aria-label="Life Evolution game">
      <canvas tabindex="0" aria-label="生命进化史游戏画面。方向键或 WASD 移动，空格键启动防护膜。"></canvas>
    </section>
  </main>
  <script src="evolution-game.js"></script>
  <script>
    window.gameInstance = EvolutionGame.mount('#game');
    // External language controls can call:
    // window.gameInstance.setLanguage('zh');
    // window.gameInstance.setLanguage('en');
    // Debug mode: window.gameInstance.setDebugEnabled(true);
    // Set zero-based level: window.gameInstance.setDebugLevel(4);
    // Or dispatch: window.dispatchEvent(new CustomEvent('app-language-change', { detail: { language: 'en' } }));
  </script>
</body>
</html>
