# Digest Worker — /intelligence/digest + subscribe/send-digest/send-test/unsubscribe + scheduled(发信)
name = "kims-video-digest"
main = "workers/digest.js"
compatibility_date = "2024-12-01"
workers_dev = false

# Backup digest sender: 06:35 Beijing = 22:35 UTC (GH Actions 06:28 is primary;
# KV "digestStatus:YYYY-MM-DD" guard makes this idempotent — skips if already sent)
[triggers]
crons = ["35 22 * * *"]

[[kv_namespaces]]
binding = "SUBSCRIBE_KV"
id = "27b767e03348423dbcd9382a925446b2"
