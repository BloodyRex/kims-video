name: Temp-Diag3-Detail
on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check TMDB tv detail last_episode_to_air for ongoing candidates
        env:
          TMDB: ${{ secrets.TMDB_API_READ_ACCESS_TOKEN }}
        run: |
          node -e '
            const token = process.env.TMDB;
            const h={headers:{Authorization:"Bearer "+token,"Content-Type":"application/json"}};
            const ids=[ // names as seen in ongoing
              ["外滩探秘","Outer Banks"], ["侠探杰克","Reacher"], ["花开锦绣",""],["毛骨悚然的恋爱",""],
              ["认识的哥哥",""],[ "百年孤独","One Hundred Years of Solitude"]
            ];
            (async()=>{
              // search each, then detail
              for(const [zh,en] of ids){
                const s=await (await fetch("https://api.themoviedb.org/3/search/tv?query="+encodeURIComponent(en||zh)+"&language=zh-CN",h)).json();
                const cand=s.results?.[0];
                if(!cand){console.log(zh,": ID NOT FOUND");continue;}
                const d=await (await fetch(`https://api.themoviedb.org/3/tv/${cand.id}?language=zh-CN&append_to_response=` ,h)).json();
                const le=d.last_episode_to_air, ne=d.next_episode_to_air;
                console.log(zh,"(id",cand.id,")","| last_ep:",le?`S${le.season_number}/E${le.episode_number} air=${le.air_date}`:"NONE","| next_ep:",ne?`S${ne.season_number} air=${ne.air_date}`:"NONE","| in_prod:",d.in_production,"| status:",d.status);
              }
            })().catch(e=>{console.log("FATAL",e.message);process.exit(1)});
          '