name: TMP count cold fetch baseline
on:
  workflow_dispatch:

jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Count cold fetches for handleIntelTV
        env:
          TMDB: ${{ secrets.TMDB_API_READ_ACCESS_TOKEN }}
        run: node scripts/count-fetches.mjs