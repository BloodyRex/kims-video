name: TMP KV audit (wallRec keys + live /wall/recs)
# 临时工作流：仅用于这次排查取证，修复合入 main 前会删除。
on:
  push:
    branches: [fix/wall-recs-paging]
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: KV 全量点名 (wallRec:*)
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          NS=76a4dab6048441cea229055a262bff8f
          cursor=""
          pages=0
          : > keys.txt
          while : ; do
            url="https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/storage/kv/namespaces/$NS/keys?prefix=wallRec%3A&limit=1000"
            if [ -n "$cursor" ]; then url="$url&cursor=$cursor"; fi
            resp=$(curl -sS --oauth2-bearer "$CF_TOKEN" "$url")
            if [ "$(echo "$resp" | jq -r '.success')" != "true" ]; then
              echo "API 报错，前 600 字："
              echo "$resp" | head -c 600
              exit 1
            fi
            n=$(echo "$resp" | jq -r '.result | length')
            echo "$resp" | jq -r '.result[].name' >> keys.txt
            pages=$((pages+1))
            cursor=$(echo "$resp" | jq -r '.result_info.cursor // ""')
            echo "第 $pages 页: $n 个键"
            [ -z "$cursor" ] && break
            [ "$pages" -gt 20 ] && { echo "页数超 20，中止"; break; }
          done
          sort -u keys.txt -o keys.txt
          echo "TOTAL_WALLREC_KEYS=$(wc -l < keys.txt)"
          echo "--- 键里 tmdbId 的位数分布 ---"
          sed 's/^wallRec://' keys.txt | awk '{print length($0)}' | sort | uniq -c
          echo "--- 最大/最小 5 个键 ---"
          head -5 keys.txt; tail -5 keys.txt
          echo "--- KEY_IDS_BEGIN ---"
          sed 's/^wallRec://' keys.txt | tr '\n' ' '
          echo
          echo "--- KEY_IDS_END ---"

      - name: 连打 3 次线上 /wall/recs
        run: |
          for i in 1 2 3; do
            t0=$(date +%s)
            body=$(curl -sS -o /tmp/r.json -w '%{http_code} %{size_download} %{time_total}' "https://api.bloodyrex.xyz/wall/recs" || echo "curl-fail")
            echo "尝试 $i → http/size/time: $body ; items=$(jq -r '.items|length' /tmp/r.json 2>/dev/null || echo n/a); err=$(jq -r '.error // ""' /tmp/r.json 2>/dev/null | head -c 120)"
          done
