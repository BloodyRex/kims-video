name: Send EN Test Digest
on:
  workflow_dispatch:
jobs:
  send-en:
    runs-on: ubuntu-latest
    steps:
      - name: Send English test digest
        run: |
          curl -s -X POST "https://api.bloodyrex.xyz/intelligence/send-test" \
            -H "Authorization: Bearer ${{ secrets.DIGEST_SECRET }}" \
            -H "Content-Type: application/json" \
            -d '{"email":"rexhr@yahoo.com","locale":"en"}'
