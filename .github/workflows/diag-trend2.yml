name: TMP diag trending zh clean
on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Clean zh-CN trending check
        env:
          TMDB: ${{ secrets.TMDB_API_READ_ACCESS_TOKEN }}
        run: node scripts/diag-trend2.mjs