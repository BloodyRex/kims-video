name: Deploy Frontend to Pages

on:
  push:
    paths:
      - "src/**"
      - "index.html"
      - "vite.config.*"
      - "package.json"
      - "public/api/**"
      - ".github/workflows/deploy-frontend.yml"
    branches: [main]
  workflow_run:
    workflows: ["Intelligence Daily Pipeline"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      # 阻断门禁（P1）：构建/部署前先校验发布产物；未通过则整步非零退出，
      # 不会执行 npm run build / upload-artifact / deploy-pages —— 未授权详情文件无法进入 dist 并上线。
      - name: Verify published artifacts (blocking gate)
        run: node scripts/festivals/verify.mjs
        env:
          # CI 显式钉住门禁：CI 恢复 granted 授权门禁（本地默认仍停用，GATE_DEFAULT=false）。
          FESTIVALS_AUTHORIZATION_GATE: "on"

      - run: npm run build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL || 'https://api.bloodyrex.xyz/' }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
