name: Temp-Diag-Mystery
on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Mystery Skin in now_playing + its metadata
        env:
          TMDB: ${{ secrets.TMDB_API_READ_ACCESS_TOKEN }}
        run: node scripts/diag-mystery.mjs