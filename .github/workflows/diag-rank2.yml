name: TMP diag rank2
on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Rank solitude exported fns
        env:
          TMDB: ${{ secrets.TMDB_API_READ_ACCESS_TOKEN }}
        run: node scripts/diag-rank2.mjs