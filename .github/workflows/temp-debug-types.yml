name: TEMP-Debug-ReleaseTypes

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe release_dates types
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_API_READ_ACCESS_TOKEN }}
        run: |
          for id in 1124142 1482938 1101383 1633056; do
            echo "--- movie $id ---"
            curl -s "https://api.themoviedb.org/3/movie/$id/release_dates" \
              -H "Authorization: Bearer ${TMDB_TOKEN}" \
              | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{const j=JSON.parse(d);for(const x of (j.results||[])){if(['US','CN','GB','GR'].includes(x.iso_3166_1)){console.log(x.iso_3166_1+': '+(x.release_dates||[]).map(z=>z.type+'='+z.release_date.slice(0,10)).join(', '))}}})"
          done
