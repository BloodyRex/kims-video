name: Temp-Diag-DigestKV
on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Query digest KV state (read-only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          echo "==SUB_LIST_REMOTE=="
          npx wrangler kv key list --binding=SUBSCRIBE_KV --prefix="sub:" --remote 2>&1 | head -30
          echo "==ALL_KEYS_REMOTE=="
          npx wrangler kv key list --binding=SUBSCRIBE_KV --remote 2>&1 | head -40
          echo "==DONE=="