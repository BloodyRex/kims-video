name: Temp-Diag-DigestKV
on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Query digest KV state (read-only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          echo "=== digestStatus keys ==="
          npx wrangler kv key list --binding=SUBSCRIBE_KV --prefix="digestStatus:" --json 2>&1 | tail -20
          echo ""
          echo "=== lastDigestSent ==="
          npx wrangler kv key get --binding=SUBSCRIBE_KV "lastDigestSent" 2>&1 | tail -5
          echo ""
          echo "=== digestStatus:2026-08-27 ==="
          npx wrangler kv key get --binding=SUBSCRIBE_KV "digestStatus:2026-08-27" 2>&1 | tail -5
          echo ""
          echo "=== digestStatus:2026-08-28 ==="
          npx wrangler kv key get --binding=SUBSCRIBE_KV "digestStatus:2026-08-28" 2>&1 | tail -5
          echo ""
          echo "=== sub count ==="
          npx wrangler kv key list --binding=SUBSCRIBE_KV --prefix="sub:" --json 2>&1 | python3 -c "import sys,json; d=json.load(sys.stdin); print('subscribers:',len(d)); [print(' ',k['name']) for k in d[:10]]" 2>/dev/null || echo "sub list fail"
          echo "DONE"