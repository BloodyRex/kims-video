name: Temp-Diag-DigestKV
on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Get digest status values
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          echo "==VALUE_0827=="
          npx wrangler kv key get --binding=SUBSCRIBE_KV "digestStatus:2026-08-27" --remote 2>&1 | head -10
          echo "==VALUE_0828=="
          npx wrangler kv key get --binding=SUBSCRIBE_KV "digestStatus:2026-08-28" --remote 2>&1 | head -10
          echo "==VALUE_LAST=="
          npx wrangler kv key get --binding=SUBSCRIBE_KV "lastDigestSent" --remote 2>&1 | head -10
          echo "==DONE=="