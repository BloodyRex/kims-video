name: Temp-Diag-DigestKV
on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Query digest KV state (read-only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          echo "==SUB_LIST=="
          npx wrangler kv key list --binding=SUBSCRIBE_KV --prefix="sub:" --json 2>&1 | head -40
          echo "==SUB_RAW=="
          npx wrangler kv key list --binding=SUBSCRIBE_KV --prefix="sub:" 2>&1 | head -20
          echo "==LAST=="
          npx wrangler kv key get --binding=SUBSCRIBE_KV --type=text "lastDigestSent" 2>&1 | head -10
          echo "==DONE=="