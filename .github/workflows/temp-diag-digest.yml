name: Temp-Diag-DigestKV
on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: digest status snapshot
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          echo "==DIGEST_STATUS_0828=="
          npx wrangler kv key get --binding=SUBSCRIBE_KV "digestStatus:2026-08-28" --remote 2>&1 | head -5
          echo "==DIGEST_CACHE_0828=="
          npx wrangler kv key get --binding=SUBSCRIBE_KV "digest:2026-08-28" --remote 2>&1 | head -c 200
          echo "==LAST=="
          npx wrangler kv key get --binding=SUBSCRIBE_KV "lastDigestSent" --remote 2>&1 | head -5
          echo "==SUB_COUNT=="
          npx wrangler kv key list --binding=SUBSCRIBE_KV --prefix="sub:" --remote 2>&1 | grep -c '"name"'
          echo "==SUB_SAMPLE=="
          npx wrangler kv key list --binding=SUBSCRIBE_KV --prefix="sub:" --remote 2>&1 | head -20
          echo "==DONE=="