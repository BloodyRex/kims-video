name: Temp-Diag-DigestKV
on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Query digest KV state (read-only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler kv key list --binding=SUBSCRIBE_KV --prefix="digestStatus:" 2>&1 | head -20
          echo "=== lastDigestSent ==="
          npx wrangler kv key get --binding=SUBSCRIBE_KV "lastDigestSent" 2>&1 | head -5
          echo "=== digestStatus:2026-08-27 ==="
          npx wrangler kv key get --binding=SUBSCRIBE_KV "digestStatus:2026-08-27" 2>&1 | head -5
          echo "=== digestStatus:2026-08-28 ==="
          npx wrangler kv key get --binding=SUBSCRIBE_KV "digestStatus:2026-08-28" 2>&1 | head -5
          echo "=== sub list count ==="
          npx wrangler kv key list --binding=SUBSCRIBE_KV --prefix="sub:" 2>&1 | grep -c '"name"'