name: Temp-Diag-DigestKV
on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Get digest status after manual trigger
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          echo "==VALUE_0828_NOW=="
          npx wrangler kv key get --binding=SUBSCRIBE_KV "digestStatus:2026-08-28" --remote 2>&1 | head -10
          echo "==LAST_NOW=="
          npx wrangler kv key get --binding=SUBSCRIBE_KV "lastDigestSent" --remote 2>&1 | head -10
          echo "==DIGESTCACHE_0828=="
          npx wrangler kv key get --binding=SUBSCRIBE_KV "digest:2026-08-28" --remote 2>&1 | head -10
          echo "==DONE=="