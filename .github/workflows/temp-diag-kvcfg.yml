name: Temp-Diag-KVConfig
on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read intel:cfg from KV
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          echo "==INTEL_CFG=="
          npx wrangler kv key get --binding=DISCOVER_KV "intel:cfg" --remote 2>&1 | head -20
          echo "==DONE=="