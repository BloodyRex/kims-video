name: Deploy Worker

on:
  push:
    paths:
      - "workers-1.4.js"
      - "wrangler.toml"
      # 壁纸主题/尺寸由构建期 JSON 导入进 bundle，配置变更必须触发重新部署
      - "config/wallpaper-themes.json"
      - "config/wallpaper-sizes.json"
      # 生图客户端与壁纸辅助函数会被打包进 Worker bundle，其变更必须触发重新部署
      - "scripts/seedream-client.mjs"
      # Worker 直接 import 的壁纸辅助函数（规格/校验/交付决策/套装结构）
      - "scripts/wall-worker-helpers.mjs"
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-worker
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Deploy Worker to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Set TMDB secret
        run: echo "${{ secrets.TMDB_API_READ_ACCESS_TOKEN }}" | npx wrangler@3.90.0 secret put TMDB_API_READ_ACCESS_TOKEN --name kims-video
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Set Resend API key
        run: echo "${{ secrets.RESEND_API_KEY }}" | npx wrangler@3.90.0 secret put RESEND_API_KEY --name kims-video
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Set Digest secret
        run: echo "${{ secrets.DIGEST_SECRET }}" | npx wrangler@3.90.0 secret put DIGEST_SECRET --name kims-video
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
