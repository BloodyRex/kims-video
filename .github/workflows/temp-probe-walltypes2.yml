name: TEMP-Probe-WallTypes2

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Full TV id list
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_API_READ_ACCESS_TOKEN }}
        run: |
          node -e "
            const fs = require('fs');
            const wall = JSON.parse(fs.readFileSync('public/api/wall.json', 'utf8'));
            const movies = wall.movies || [];
            const ids = [...new Set(movies.map(m => m.tmdbId).filter(Boolean))];
            const BATCH = 40;
            let out = [];
            (async () => {
              for (let s = 0; s < ids.length; s += BATCH) {
                const batch = ids.slice(s, s + BATCH);
                const results = await Promise.all(batch.map(async (id) => {
                  try {
                    const r = await fetch('https://api.themoviedb.org/3/movie/' + id, {
                      headers: { Authorization: 'Bearer ' + process.env.TMDB_TOKEN }
                    });
                    if (r.status === 404) {
                      const t = await fetch('https://api.themoviedb.org/3/tv/' + id, {
                        headers: { Authorization: 'Bearer ' + process.env.TMDB_TOKEN }
                      });
                      if (t.ok) {
                        const j = await t.json();
                        return id + '|' + (j.name || '?');
                      }
                    }
                    return null;
                  } catch { return null; }
                }));
                out.push(...results.filter(Boolean));
                await new Promise(r => setTimeout(r, 250));
              }
              fs.writeFileSync('tv-ids.txt', out.join('\\n'));
              console.log('TOTAL:' + out.length);
            })();
          "
          cat tv-ids.txt
