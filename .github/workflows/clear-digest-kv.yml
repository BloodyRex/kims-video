name: Clear Digest KV and Resend
on: workflow_dispatch
jobs:
  clear-and-send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clear digest status
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: kv key delete "digestStatus:2026-07-25" --namespace-id "27b767e03348423dbcd9382a925446b2" --remote

      - name: Wait for KV propagation
        run: sleep 10

      - name: Trigger digest resend
        run: >-
          curl -s -X POST "https://api.bloodyrex.xyz/intelligence/send-digest"
          -H "Authorization: Bearer ${{ secrets.DIGEST_SECRET }}"
          -H "Content-Type: application/json"
