name: TEMP-Probe-Discover

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe discover/movie semantics for CN films
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_API_READ_ACCESS_TOKEN }}
        run: |
          echo "=== A) discover/movie recent 90d (popularity desc, page1) — check 八仙 & 龙餐馆 ==="
          curl -s "https://api.themoviedb.org/3/discover/movie?primary_release_date.gte=2026-05-20&primary_release_date.lte=2026-08-18&sort_by=popularity.desc&language=zh-CN&page=1" \
            -H "Authorization: Bearer ${TMDB_TOKEN}" | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{const j=JSON.parse(d);console.log('total:',j.total_results,'page1:',(j.results||[]).length);for(const m of (j.results||[]).slice(0,25)){if([1633056,1391021,1185806,1101383].includes(m.id)||m.popularity>50)console.log(JSON.stringify({id:m.id,title:m.title,date:m.release_date,pop:m.popularity}))}})"

          echo "=== B) 1391021 在 discover 里吗？搜索 page 2-5 ==="
          for p in 2 3 4 5; do
            curl -s "https://api.themoviedb.org/3/discover/movie?primary_release_date.gte=2026-05-20&primary_release_date.lte=2026-08-18&sort_by=popularity.desc&language=zh-CN&page=$p" \
              -H "Authorization: Bearer ${TMDB_TOKEN}" | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{const j=JSON.parse(d);const hit=(j.results||[]).filter(m=>m.id===1391021||m.id===1633056);if(hit.length)console.log('FOUND p'+$p+': '+JSON.stringify(hit.map(h=>({id:h.id,title:h.title,date:h.release_date,pop:h.popularity}))))})"
          done
          echo "(done)"

          echo "=== C) discover/movie with region=CN? ==="
          curl -s "https://api.themoviedb.org/3/discover/movie?region=CN&primary_release_date.gte=2026-05-20&primary_release_date.lte=2026-08-18&sort_by=popularity.desc&language=zh-CN&page=1" \
            -H "Authorization: Bearer ${TMDB_TOKEN}" | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{const j=JSON.parse(d);console.log('total:',j.total_results);for(const m of (j.results||[]).slice(0,15)){if(m.id===1391021||m.id===1633056||m.popularity>40)console.log(JSON.stringify({id:m.id,title:m.title,date:m.release_date,pop:m.popularity}))}})"

          echo "=== D) 1391021 在 upcoming discover (future) 里吗？==="
          curl -s "https://api.themoviedb.org/3/discover/movie?primary_release_date.gte=2026-08-18&primary_release_date.lte=2026-11-16&sort_by=popularity.desc&language=zh-CN&page=1" \
            -H "Authorization: Bearer ${TMDB_TOKEN}" | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{const j=JSON.parse(d);console.log('total:',j.total_results);const hit=(j.results||[]).filter(m=>m.id===1391021);console.log('1391021 found:',hit.length)})"
