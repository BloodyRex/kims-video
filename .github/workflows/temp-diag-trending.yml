name: Temp-Diag-Trending
on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch trending zh + check 百年孤独 cnFilter
        env:
          TMDB: ${{ secrets.TMDB_API_READ_ACCESS_TOKEN }}
        run: |
          node -e '
            const token = process.env.TMDB;
            const base="https://api.themoviedb.org/3";
            const h={headers:{Authorization:"Bearer "+token,"Content-Type":"application/json"}};
            (async()=>{
              let all=[];
              for(let p=1;p<=3;p++){
                const r=await fetch(base+`/trending/tv/week?language=zh-CN&page=${p}`,h);
                const d=await r.json(); all=all.concat(d.results||[]);
              }
              const hasCN=t=>/[一-鿿]/.test(t||"");
              const hit=all.find(s=>/100 Lines|One Hundred|Macondo|孤独/i.test(s.name+""+(s.original_name||"")));
              const named = all.filter(s=>/孤独|Fool|Cien anos/i.test(s.name));
              console.log("pulled total:",all.length);
              console.log("百年孤独 raw:",hit?JSON.stringify({name:hit.name,ov:(hit.overview||"").slice(0,60),cnName:hasCN(hit.name),cnOv:hasCN(hit.overview),pop:hit.popularity,air:hit.first_air_date}):"NOT FOUND");
              // cnFilter survive count
              const pass=all.filter(s=>hasCN(s.name)&&hasCN(s.overview)&&(!s.vote_average||s.vote_average>=4)&&Number((s.first_air_date||"").slice(0,4))>=2010&&(s.popularity||0)>=30);
              console.log("titles passing full cnFilter+gate:",pass.length, pass.slice(0,12).map(s=>s.name).join(" | "));
            })().catch(e=>{console.log("FATAL",e.message);process.exit(1)});
          '