name: TEMP-Probe-1391021

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe movie 1391021 + bucket semantics
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_API_READ_ACCESS_TOKEN }}
        run: |
          echo "=== 1) movie 1391021 details zh-CN ==="
          curl -s "https://api.themoviedb.org/3/movie/1391021?language=zh-CN" \
            -H "Authorization: Bearer ${TMDB_TOKEN}" | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{const j=JSON.parse(d);console.log(JSON.stringify({id:j.id,title:j.title,original_title:j.original_title,release_date:j.release_date,overview:(j.overview||'').slice(0,120),popularity:j.popularity,vote:j.vote_average}))})"

          echo "=== 2) movie 1391021 details en-US ==="
          curl -s "https://api.themoviedb.org/3/movie/1391021?language=en-US" \
            -H "Authorization: Bearer ${TMDB_TOKEN}" | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{const j=JSON.parse(d);console.log(JSON.stringify({title:j.title,original_title:j.original_title,release_date:j.release_date,overview:(j.overview||'').slice(0,120)}))})"

          echo "=== 3) 1391021 in now_playing region=US? ==="
          for p in 1 2 3 4; do
            curl -s "https://api.themoviedb.org/3/movie/now_playing?region=US&language=zh-CN&page=$p" \
              -H "Authorization: Bearer ${TMDB_TOKEN}" | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{const j=JSON.parse(d);const hit=(j.results||[]).filter(m=>m.id===1391021);if(hit.length)console.log('FOUND page '+$p+': '+JSON.stringify(hit[0]))})"
          done
          echo "(no FOUND lines = not in now_playing US)"

          echo "=== 4) search by title ==="
          curl -s "https://api.themoviedb.org/3/search/movie?query=Once%20Upon%20a%20Time%20in%20the%20Middle%20East&language=zh-CN&include_adult=false" \
            -H "Authorization: Bearer ${TMDB_TOKEN}" | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{const j=JSON.parse(d);for(const m of (j.results||[]).slice(0,5)){console.log(JSON.stringify({id:m.id,title:m.title,orig:m.original_title,date:m.release_date}))}})"

          echo "=== 5) release_dates for 1391021 ==="
          curl -s "https://api.themoviedb.org/3/movie/1391021/release_dates" \
            -H "Authorization: Bearer ${TMDB_TOKEN}" | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{const j=JSON.parse(d);for(const x of (j.results||[])){if(['US','CN','HK','TW'].includes(x.iso_3166_1)){console.log(x.iso_3166_1+': '+(x.release_dates||[]).map(z=>z.type+'='+z.release_date.slice(0,10)).join(', '))}}})"
