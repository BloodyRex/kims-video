name: TEMP-Probe-NiuLai2

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe CN pool candidates + selection math
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_API_READ_ACCESS_TOKEN }}
        run: |
          node -e '
          const t = process.env.TMDB_TOKEN;
          const H = { Authorization: `Bearer ${t}`, "Content-Type": "application/json" };
          (async () => {
            // CN now_playing 2 pages
            const cn = [];
            for (let p = 1; p <= 2; p++) {
              const r = await fetch(`https://api.themoviedb.org/3/movie/now_playing?region=CN&page=${p}`, { headers: H });
              const j = await r.json();
              cn.push(...(j.results || []));
            }
            const niu = cn.find(m => m.id === 1748007);
            console.log("CN pool size:", cn.length, "| 牛来 in CN pool:", niu ? "YES" : "NO");

            // 模拟 nowPlayingCandidates 过滤（排除本周+upcoming 复杂，只显示 CN 池候选）
            const cnCands = cn
              .filter(m => m.release_date && m.release_date >= "2026-05-22")
              .filter(m => /[\u4e00-\u9fff]/.test(m.title) && /[\u4e00-\u9fff]/.test(m.overview || ""))
              .filter(m => (m.popularity || 0) >= 8 && (!m.vote_average || m.vote_average >= 2));
            console.log("CN pool candidates after filters:", cnCands.length);
            cnCands.sort((a, b) => b.popularity - a.popularity);
            for (const m of cnCands.slice(0, 20)) {
              const flag = m.id === 1748007 ? " ⭐牛来" : "";
              console.log(`  pop=${m.popularity.toFixed(1)} vote=${m.vote_average || 0} | ${m.title} | ${m.release_date}${flag}`);
            }
          })().catch(e => { console.error("ERR", e.message); process.exit(1); });
          '
