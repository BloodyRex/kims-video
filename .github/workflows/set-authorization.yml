name: set-authorization

on:
  workflow_dispatch:
    inputs:
      edition_id:
        description: "Edition ID (e.g. cannes-2026)"
        required: true
        type: string
      authorization:
        description: "Authorization status"
        required: true
        type: choice
        options:
          - granted
          - testing
          - pending
      note_zh:
        description: "Optional authorizationNote (zh). Leave empty to keep existing note untouched."
        required: false
        type: string
      note_en:
        description: "Optional authorizationNote (en). Must be provided together with note_zh."
        required: false
        type: string

jobs:
  set-authorization:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # 单一真源在 scripts/festivals/set-authorization.mjs：同时写
      #   data/festivals/registry.json   （festival 级 authorization）
      #   data/festivals/editions/<id>.json （festival 级 authorization，"festival" 对象内）
      # 门禁判据读的是 editions 文件，所以只改 registry 不生效（见 run.mjs:167 / run.mjs:280 / verify.mjs）。
      # 脚本默认 DRY-RUN，--apply 才写盘，写盘前有 JSON.parse 校验；CRLF 与不规则缩进均保持。
      # authorizationNote（{zh,en} 多行对象）可选：只有 note_zh 与 note_en 同时非空才写入两侧；
      # 都不填则保持原值不动（避免误清空）。只填一个会被脚本拒绝（exit 2）。
      - name: Set authorization (registry + editions)
        run: |
          NOTE_ARGS=()
          if [ -n "${{ github.event.inputs.note_zh }}" ] || [ -n "${{ github.event.inputs.note_en }}" ]; then
            NOTE_ARGS=(--note-zh "${{ github.event.inputs.note_zh }}" --note-en "${{ github.event.inputs.note_en }}")
          fi
          node scripts/festivals/set-authorization.mjs \
            --edition "${{ github.event.inputs.edition_id }}" \
            --authorization "${{ github.event.inputs.authorization }}" \
            "${NOTE_ARGS[@]}" \
            --apply

      # 落盘后立刻离线复核：确保没有制造新违规（未放行届次泄漏到公开索引、旧公开文件残留等）
      - name: Verify (default)
        run: node scripts/festivals/verify.mjs

      - name: Verify (gate on)
        run: FESTIVALS_AUTHORIZATION_GATE=on node scripts/festivals/verify.mjs

      # 两个真源都要进提交，否则 editions 侧改动会在下次 fetch 时被 normalize 覆盖回去
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/festivals/registry.json data/festivals/editions
          git diff --cached --quiet || git commit -m "set-authorization: ${{ github.event.inputs.edition_id }} -> ${{ github.event.inputs.authorization }}"
          git push
