name: TEMP-Probe-NiuLai3

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe each filter step
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_API_READ_ACCESS_TOKEN }}
        run: |
          node -e '
          const t = process.env.TMDB_TOKEN;
          const H = { Authorization: `Bearer ${t}`, "Content-Type": "application/json" };
          (async () => {
            const cn = [];
            for (let p = 1; p <= 2; p++) {
              const r = await fetch(`https://api.themoviedb.org/3/movie/now_playing?region=CN&page=${p}`, { headers: H });
              const j = await r.json();
              cn.push(...(j.results || []));
            }
            console.log("total:", cn.length);
            const niu = cn.find(m => m.id === 1748007);
            if (niu) console.log("niu release_date:", JSON.stringify(niu.release_date), "| title:", JSON.stringify(niu.title), "| overview zh:", /[\u4e00-\u9fff]/.test(niu.overview || ""), "| pop:", niu.popularity, "| vote:", niu.vote_average);

            // 条件1: release_date
            const c1 = cn.filter(m => m.release_date && m.release_date >= "2026-05-22");
            console.log("after release_date>=05-22:", c1.length);
            // 看 release_date 都是什么
            const rdSamples = cn.slice(0, 8).map(m => JSON.stringify(m.release_date));
            console.log("release_date samples:", rdSamples.join(", "));

            // 条件2: 中文标题+简介
            const c2 = cn.filter(m => /[\u4e00-\u9fff]/.test(m.title) && /[\u4e00-\u9fff]/.test(m.overview || ""));
            console.log("after zh title+overview:", c2.length);

            // 条件3: pop>=8 vote>=2
            const c3 = cn.filter(m => (m.popularity || 0) >= 8 && (!m.vote_average || m.vote_average >= 2));
            console.log("after pop>=8 vote>=2:", c3.length);

            // 全组合
            const all = cn.filter(m =>
              m.release_date && m.release_date >= "2026-05-22" &&
              /[\u4e00-\u9fff]/.test(m.title) && /[\u4e00-\u9fff]/.test(m.overview || "") &&
              (m.popularity || 0) >= 8 && (!m.vote_average || m.vote_average >= 2));
            console.log("all filters:", all.length);
            console.log("niu passes all:", all.some(m => m.id === 1748007));
          })().catch(e => { console.error("ERR", e.message); process.exit(1); });
          '
