name: Temp-Diag-FinalCheck
on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Final check subscribers + digest status
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          echo "==SUBS=="
          npx wrangler kv key list --binding=SUBSCRIBE_KV --prefix="sub:" --remote 2>&1 | grep -aoE '"name": "sub:[^"]+"' | sed -E 's/"name": "//; s/"$//' | sort
          echo "==STATUS0828=="
          npx wrangler kv key get --binding=SUBSCRIBE_KV "digestStatus:2026-08-28" --remote 2>&1 | head -5
          echo "==LAST=="
          npx wrangler kv key get --binding=SUBSCRIBE_KV "lastDigestSent" --remote 2>&1 | head -5
          echo "==DONE=="