name: Calibrate Upcoming TV (throwaway)
on:
  workflow_dispatch:

jobs:
  cal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run upcoming-TV calibration
        run: node scripts/calibrate-upcoming.mjs
        env:
          TMDB_API_READ_ACCESS_TOKEN: ${{ secrets.TMDB_API_READ_ACCESS_TOKEN }}