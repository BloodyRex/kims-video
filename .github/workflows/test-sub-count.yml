name: Test Subscriber Count

on:
  workflow_dispatch:

jobs:
  count:
    runs-on: ubuntu-latest
    steps:
      - name: List subscribers from KV
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler@3.90.0 kv key list --namespace-id 27b767e03348423dbcd9382a925446b2 --prefix "sub:" | python3 -c "
          import json, sys
          keys = json.load(sys.stdin)
          print('SUB_COUNT:' + str(len(keys)))
          for k in keys:
              print('SUB:' + (k.get('name', '') or ''))
          "
