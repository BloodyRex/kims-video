name: Cleanup Test KV Key
on: workflow_dispatch
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete test wallRec key
        run: npx wrangler@3.90.0 kv key delete "wallRec:1243335" --namespace-id "76a4dab6048441cea229055a262bff8f" --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
